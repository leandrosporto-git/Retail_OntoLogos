services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/retail_ontologos
    ports:
      - "7474:7474"   # navegador do Neo4j: http://localhost:7474
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p retail_ontologos 'RETURN 1' || exit 1"]
      interval: 5s
      retries: 30
  app:
    build: .
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: retail_ontologos
    ports:
      - "8501:8501"   # interface: http://localhost:8501
    depends_on:
      neo4j:
        condition: service_healthy
    command: >
      sh -c "python -m retail_ontologos.carga && python -m retail_ontologos.motor &&
             streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501"

# Parâmetros das regras de diagnóstico e destinação (V_Zero, validada em 17/11/2026).
# Os limites seguem o documento de definições validado com o especialista de domínio.
# Mudou um limite? Suba a versão das regras.
versao_regras: "0.2.0"

data_referencia: "2026-10-31"          # data da foto de estoque avaliada
inicio_historico_vendas: "2024-01-01"  # início da janela de vendas disponível

escopo:
  codigo: OUTLET
  nome: "Rede outlet"
  fachada: OUT            # o escopo inclui as filiais que operam sob esta fachada

limites:
  idade_meses: 24         # "mais de 24 meses" desde o lançamento (meses de calendário, estrito)
  dias_sem_venda: 180     # "mais de 180 dias" sem venda válida na rede (estrito)
  meses_filial_nova: 12   # filial com até 12 meses de abertura é nova (critério SSS)

venda_valida:
  tipos: [venda]          # cancelamento e devolução não contam como venda válida (definição pendente)

financeiro:
  taxa_custo_capital_anual: 0.15   # custo de capital usado no custo de oportunidade (proposta original)

destinacao:
  percentual_baixa_marca_descontinuada: 100
